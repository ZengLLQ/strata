schema_version: "1.0.0"

metadata:
  id: "integ_http_cluster"
  name: "Real HTTP 3-Node Cluster Integration"
  version: "1.0.0"
  description: "End-to-end integration experiment executing against a real 3-node HTTP cluster with controlled fault injection."
  tags:
    - "integration"
    - "http"
    - "real-system"
    - "fault-injection"

execution:
  mode: "integration"
  seed: 42
  deterministic: false
  allow_destructive: false

topology:
  nodes:
    - id: "node-1"
      role: "coordinator"
      initial_state: "online"
      parameters:
        endpoint: "http://127.0.0.1:18001"
    - id: "node-2"
      role: "replica"
      initial_state: "online"
      parameters:
        endpoint: "http://127.0.0.1:18002"
    - id: "node-3"
      role: "replica"
      initial_state: "online"
      parameters:
        endpoint: "http://127.0.0.1:18003"

  network:
    default_latency_us: 1000
    default_jitter_us: 0
    default_drop_rate: 0.0

workload:
  workload_type: "replicated_kv"
  operations_count: 6
  arrival_interval_us: 10000
  key_space_size: 3
  target_nodes:
    - "node-1"

faults:
  - id: "fault_crash_node_2"
    fault_type: "node_crash"
    target: "node-2"
    trigger_time_us: 15000
    duration_us: 20000

invariants:
  - id: "inv_state_convergence"
    invariant_type: "state_convergence"
    description: "Verify that surviving online cluster nodes have synchronized their replicated key-value state"
  - id: "inv_fault_observed"
    invariant_type: "fault_observed"
    description: "Verify that the scheduled node_crash fault was actually dispatched and applied"
  - id: "inv_no_panic"
    invariant_type: "no_panic"
    description: "Verify the integration run completed without unhandled fatal server exceptions"

limits:
  max_virtual_time_us: 10000000
  max_events: 100000
  wall_clock_timeout_seconds: 15.0

artifacts:
  output_dir: "./artifacts"
  persist_sqlite: true
  persist_jsonl: true
